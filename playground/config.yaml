# Config do playground: 1 main + 2 shards (recebíveis por CNPJ).
dialect: postgres

databases:
  - id: db_main
    connection_env: MAIN_DB_URL
    read_only: true
    connect_timeout: 10

  - id: db_shard_1
    connection_env: SHARD_1_DB_URL
    read_only: true

  - id: db_shard_2
    connection_env: SHARD_2_DB_URL
    read_only: true

tables:
  - id: clientes
    database: db_main
    schema: public
    name: clientes
    description: >-
      Cadastro de clientes (PJ) com CNPJ e razão social. Não shardada.
    duckdb:
      enabled: true
      trigger: join
      fetch_limit: 100000
  - id: recebiveis
    database: db_main
    schema: public
    name: recebiveis
    description: >-
      Títulos a receber. Shardada por CNPJ em 2 bancos; agregações via DuckDB.
    sharding:
      discriminator_column: cnpj
      resolver: "playground.shard_resolver:resolve_cnpj_shard"
      value_extractor: "playground.shard_resolver:extract_cnpj_values"
    columns:
      - name: cnpj
        type: VARCHAR
        description: "CNPJ 14 dígitos."
      - name: valor
        type: NUMERIC
        description: "Valor bruto BRL."
      - name: data_vencimento
        type: DATE
        description: "Vencimento YYYY-MM-DD."
      - name: status
        type: VARCHAR
        description: "pendente | pago | vencido"
    duckdb:
      enabled: true
      trigger: aggregation
      fetch_limit: 100000
      force_analytical: true

relationships:
  - from: { table: recebiveis, column: cnpj }
    to: { table: clientes, column: cnpj }
    description: "Recebível pertence ao cliente."

glossary:
  - term: recebível
    definition: "Título de crédito a receber."
  - term: CNPJ
    definition: "14 dígitos, sem formatação."

agent:
  sample_rows: 50
  query_max_rows: 500000
  max_string_length: 10000
  read_only: true
  max_shards: 20
  query_timeout: 30
  # export:
  #   enabled: true
  #   dir: /tmp/txt2sql-exports
  #   base_url: http://localhost:8501/exports
  #   ttl_seconds: 86400
  #   delimiter: ";"
  #   max_rows: 500000

llm:
  deployment: gpt-5.4-mini
  api_version: "2024-12-01-preview"
  temperature: 0.0

custom_section: |
  Playground de testes. recebiveis é SHARDADA por CNPJ (2 shards).
  Inclua o CNPJ em IntentPlan.filters (eq/in) quando a pergunta já trouxer o valor.
  Sem discriminador mas com escopo via clientes: o sistema faz lookup automático.
  NUNCA faça fan-out cego sem lista de discriminadores.
  NUNCA JOIN cross-database entre clientes e recebiveis.
