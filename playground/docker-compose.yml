services:
  db_main:
    image: postgres:16
    environment:
      POSTGRES_USER: txt2sql
      POSTGRES_PASSWORD: txt2sql
      POSTGRES_DB: txt2sql
    ports:
      - "15432:5432"
    volumes:
      - ./seed/01_main.sql:/docker-entrypoint-initdb.d/01_main.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txt2sql -d txt2sql"]
      interval: 3s
      timeout: 3s
      retries: 10

  db_shard_1:
    image: postgres:16
    environment:
      POSTGRES_USER: txt2sql
      POSTGRES_PASSWORD: txt2sql
      POSTGRES_DB: txt2sql
    ports:
      - "15433:5432"
    volumes:
      - ./seed/02_shard1.sql:/docker-entrypoint-initdb.d/01_shard.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txt2sql -d txt2sql"]
      interval: 3s
      timeout: 3s
      retries: 10

  db_shard_2:
    image: postgres:16
    environment:
      POSTGRES_USER: txt2sql
      POSTGRES_PASSWORD: txt2sql
      POSTGRES_DB: txt2sql
    ports:
      - "15434:5432"
    volumes:
      - ./seed/03_shard2.sql:/docker-entrypoint-initdb.d/01_shard.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txt2sql -d txt2sql"]
      interval: 3s
      timeout: 3s
      retries: 10
